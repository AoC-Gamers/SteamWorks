name: Build SteamWorks

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      sdk_name:
        description: "Pinned Steamworks SDK 1.55"
        type: choice
        options:
          - sdk_155
        required: true
        default: "sdk_155"
      publish_release:
        description: "Publish the channel or versioned release"
        type: boolean
        default: false

concurrency:
  group: steamworks-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  linux-runner:
    runs-on: ubuntu-22.04
    outputs:
      label: ${{ steps.runner.outputs.label }}
    steps:
      - name: Validate the L4D2 Linux runner
        id: runner
        shell: bash
        env:
          L4D2_EXT_LINUX_RUNNER: ${{ vars.L4D2_EXT_LINUX_RUNNER }}
        run: |
          if [[ -z "${L4D2_EXT_LINUX_RUNNER//[[:space:]]/}" ]]; then
            echo "::error::L4D2_EXT_LINUX_RUNNER is missing or empty. Set it in AoC-Gamers and enable it for this repository."
            exit 1
          fi
          printf 'label=%s\n' "$L4D2_EXT_LINUX_RUNNER" >> "$GITHUB_OUTPUT"

  deps-exts-linux:
    needs: linux-runner
    runs-on: ${{ needs.linux-runner.outputs.label }}
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}

    steps:
      - name: Checkout SteamWorks
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        shell: bash
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y python3 python3-venv make gcc-multilib g++-multilib clang

      - name: Resolve dependency cache key
        id: cache-key
        shell: bash
        env:
          LINUX_RUNNER_LABEL: ${{ needs.linux-runner.outputs.label }}
        run: |
          echo "key=exts-linux-deps-${{ runner.os }}-$LINUX_RUNNER_LABEL-${{ hashFiles('scripts/deps/fetch-linux-deps.sh', 'scripts/build/build-linux-l4d2.sh', 'scripts/package/stage-artifact.py', 'scripts/package/artifact_contract.py', 'scripts/package/package-release.py', 'scripts/package/package-map.json', 'Makefile', 'configure.py', 'AMBuildScript', 'PackageScript', 'scripts/build/steamworks-sdk.lock.json', 'scripts/build/validate-steamworks-sdk.py') }}" >> "$GITHUB_OUTPUT"

      - name: Restore dependency cache
        id: deps-cache-restore
        uses: actions/cache/restore@v5
        with:
          path: .deps/exts-linux
          key: ${{ steps.cache-key.outputs.key }}

      - name: Fetch Linux extension dependencies
        if: steps.deps-cache-restore.outputs.cache-hit != 'true'
        shell: bash
        run: make deps-exts-linux

      - name: Save dependency cache
        if: steps.deps-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .deps/exts-linux
          key: ${{ steps.cache-key.outputs.key }}

  build-exts-linux:
    runs-on: ${{ needs.linux-runner.outputs.label }}
    needs: [linux-runner, deps-exts-linux]
    outputs:
      basename: ${{ steps.artifact.outputs.basename }}
      release-tag: ${{ steps.artifact.outputs.release_tag }}
      release-name: ${{ steps.artifact.outputs.release_name }}
      prerelease: ${{ steps.artifact.outputs.prerelease }}

    steps:
      - name: Checkout SteamWorks
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout Steamworks-SDK
        uses: actions/checkout@v6
        with:
          repository: AoC-Gamers/Steamworks-SDK
          ref: a7aaa2754d9cda244d0cd9d7523c1144a1c472d2
          path: steamworks-sdk
          token: ${{ secrets.STEAMWORKS_SDK_TOKEN }}

      - name: Install Linux dependencies
        shell: bash
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y python3 python3-venv make gcc-multilib g++-multilib clang

      - name: Restore dependency cache
        uses: actions/cache/restore@v5
        with:
          path: .deps/exts-linux
          key: ${{ needs.deps-exts-linux.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Resolve SDK name
        id: sdk
        shell: bash
        env:
          SDK_NAME: ${{ github.event.inputs.sdk_name }}
        run: |
          SDK_NAME="${SDK_NAME:-sdk_155}"
          if [[ "$SDK_NAME" != "sdk_155" ]]; then
            echo "Only sdk_155 is supported" >&2
            exit 1
          fi
          echo "dir=$GITHUB_WORKSPACE/steamworks-sdk/$SDK_NAME" >> "$GITHUB_OUTPUT"

      - name: Validate SDK path
        shell: bash
        run: |
          if [[ ! -d "${{ steps.sdk.outputs.dir }}" ]]; then
            echo "Steamworks SDK directory not found: ${{ steps.sdk.outputs.dir }}" >&2
            exit 1
          fi

      - name: Test public API compatibility and additive contracts
        run: make test-public-api

      - name: Test extension entrypoint ownership (x86, ASan/UBSan)
        run: make test-extension-entrypoint

      - name: Test stats request callbacks (x86, ASan/UBSan)
        env:
          STEAMWORKS_SDK_DIR: ${{ steps.sdk.outputs.dir }}
        run: make test-stats-callbacks

      - name: Test legacy ticket ownership (x86, ASan/UBSan)
        env:
          STEAMWORKS_SDK_DIR: ${{ steps.sdk.outputs.dir }}
        run: make test-ticket-ownership

      - name: Test pinned SDK selection and negative controls
        env:
          STEAMWORKS_SDK_DIR: ${{ steps.sdk.outputs.dir }}
        run: make test-sdk-selection

      - name: Test local review packaging and rollback contract
        run: make test-review-artifacts

      - name: Test Make interface and execution paths
        run: make test-make-interface

      - name: Test channel release notes offline
        run: make test-release-notes

      - name: Test stats natives (x86, UBSan)
        shell: bash
        env:
          STEAMWORKS_SDK_DIR: ${{ steps.sdk.outputs.dir }}
        run: make test-stats-natives

      - name: Test detour owner and wrappers (x86, UBSan)
        shell: bash
        env:
          STEAMWORKS_SDK_DIR: ${{ steps.sdk.outputs.dir }}
        run: make test-detours

      - name: Test init observer coexistence (x86, UBSan)
        shell: bash
        env:
          STEAMWORKS_SDK_DIR: ${{ steps.sdk.outputs.dir }}
        run: make test-init-coexistence

      - name: Test public IPv4 natives (x86, signed/unsigned char, UBSan)
        shell: bash
        env:
          STEAMWORKS_SDK_DIR: ${{ steps.sdk.outputs.dir }}
        run: make test-public-ip

      - name: Test SteamID string contract (x86, UBSan)
        shell: bash
        env:
          STEAMWORKS_SDK_DIR: ${{ steps.sdk.outputs.dir }}
          AMTL_DIR: ${{ github.workspace }}/.deps/exts-linux/sourcemod-1.12/public/amtl
        run: make test-steamid-string

      - name: Test typed boundary and interface registry (x86, UBSan)
        shell: bash
        env:
          STEAMWORKS_SDK_DIR: ${{ steps.sdk.outputs.dir }}
        run: make test-typed-boundary

      - name: Test restart forward semantics (x86, UBSan)
        shell: bash
        env:
          STEAMWORKS_SDK_DIR: ${{ steps.sdk.outputs.dir }}
        run: make test-restart-forward-semantics

      - name: Test resource lifecycle (x86, UBSan)
        shell: bash
        env:
          STEAMWORKS_SDK_DIR: ${{ steps.sdk.outputs.dir }}
        run: make test-resource-lifecycle

      - name: Test binary evidence and documentary profiles (x86)
        shell: bash
        env:
          STEAMWORKS_SDK_DIR: ${{ steps.sdk.outputs.dir }}
        run: make test-binary-evidence

      - name: Test opt-in diagnostic log (x86, UBSan)
        shell: bash
        run: make test-debug-log

      - name: Test typed auth binding with real SourceHook (x86, UBSan)
        shell: bash
        env:
          STEAMWORKS_SDK_DIR: ${{ steps.sdk.outputs.dir }}
          MMSOURCE_DIR: ${{ github.workspace }}/.deps/exts-linux/mmsource-1.12
        run: make test-auth-binding

      - name: Test streaming HTTP context (x86, UBSan)
        shell: bash
        env:
          STEAMWORKS_SDK_DIR: ${{ steps.sdk.outputs.dir }}
        run: make test-http-stream-context

      - name: Build Linux extension
        shell: bash
        run: make build-exts-linux STEAMWORKS_SDK_DIR="${{ steps.sdk.outputs.dir }}"

      - name: Test incremental SDK rejection (real x86 build)
        shell: bash
        run: |
          make test-sdk-incremental \
            TEST_OUTPUT=.build/sdk-incremental-ci \
            STEAMWORKS_SDK_DIR="${{ steps.sdk.outputs.dir }}"

      - name: Resolve Linux artifact name
        id: artifact
        shell: bash
        run: |
          {
            if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
              version="${GITHUB_REF_NAME#v}"
              echo "basename=steamworks-$version-linux"
              echo "release_tag=${GITHUB_REF_NAME}"
              echo "release_name=SteamWorks $version"
              echo "prerelease=false"
              exit 0
            fi
            case "${GITHUB_REF_NAME}" in
              main)
                echo "basename=steamworks-latest-linux"
                echo "release_tag=channel/latest"
                echo "release_name=Latest"
                echo "prerelease=false"
                ;;
              develop)
                echo "basename=steamworks-develop-linux"
                echo "release_tag=channel/develop"
                echo "release_name=Develop"
                echo "prerelease=true"
                ;;
              *)
                echo "basename=steamworks-${GITHUB_SHA::7}-linux"
                ;;
            esac
          } >> "$GITHUB_OUTPUT"

      - name: Upload Linux build tree
        uses: actions/upload-artifact@v7
        with:
          name: exts-build-linux
          path: .build/linux-l4d2
          if-no-files-found: error
          retention-days: 1

  release-linux:
    runs-on: ${{ needs.linux-runner.outputs.label }}
    needs: [linux-runner, build-exts-linux]

    steps:
      - name: Checkout SteamWorks
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 make

      - name: Download Linux build tree
        uses: actions/download-artifact@v8
        with:
          name: exts-build-linux
          path: .build/linux-l4d2

      - name: Package Linux extension tree
        run: make package-exts-linux

      - name: Create Linux release zip
        run: make release-linux RELEASE_BASENAME="${{ needs.build-exts-linux.outputs.basename }}"

      - name: Validate Linux artifact
        env:
          EXTS_ARTIFACT_DIR: ${{ github.workspace }}/dist/linux/artifact
          EXTS_PLATFORM: linux
        run: make validate-artifact-linux

      - name: Upload Linux release zip
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.build-exts-linux.outputs.basename }}
          path: dist/release/${{ needs.build-exts-linux.outputs.basename }}.zip
          if-no-files-found: error
          retention-days: 14

  deps-exts-windows:
    runs-on: windows-2022
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}

    steps:
      - name: Checkout SteamWorks
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve dependency cache key
        id: cache-key
        shell: bash
        run: |
          echo "key=exts-windows-deps-${{ runner.os }}-${{ hashFiles('scripts/deps/fetch-windows-deps.ps1', 'scripts/build/build-windows-l4d2.ps1', 'scripts/package/stage-artifact.py', 'scripts/package/artifact_contract.py', 'scripts/package/package-release.py', 'scripts/package/package-map.json', 'Makefile', 'configure.py', 'AMBuildScript', 'PackageScript', 'scripts/build/steamworks-sdk.lock.json', 'scripts/build/validate-steamworks-sdk.py') }}" >> "$GITHUB_OUTPUT"

      - name: Restore dependency cache
        id: deps-cache-restore
        uses: actions/cache/restore@v5
        with:
          path: .deps/exts-windows
          key: ${{ steps.cache-key.outputs.key }}

      - name: Fetch Windows extension dependencies
        if: steps.deps-cache-restore.outputs.cache-hit != 'true'
        shell: pwsh
        run: make deps-exts-windows

      - name: Save dependency cache
        if: steps.deps-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .deps/exts-windows
          key: ${{ steps.cache-key.outputs.key }}

  build-exts-windows:
    runs-on: windows-2022
    needs: deps-exts-windows
    outputs:
      basename: ${{ steps.artifact.outputs.basename }}

    steps:
      - name: Checkout SteamWorks
        uses: actions/checkout@v6

      - name: Checkout Steamworks-SDK
        uses: actions/checkout@v6
        with:
          repository: AoC-Gamers/Steamworks-SDK
          ref: a7aaa2754d9cda244d0cd9d7523c1144a1c472d2
          path: steamworks-sdk
          token: ${{ secrets.STEAMWORKS_SDK_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore dependency cache
        uses: actions/cache/restore@v5
        with:
          path: .deps/exts-windows
          key: ${{ needs.deps-exts-windows.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Resolve SDK name
        id: sdk
        shell: bash
        env:
          SDK_NAME: ${{ github.event.inputs.sdk_name }}
        run: |
          SDK_NAME="${SDK_NAME:-sdk_155}"
          if [[ "$SDK_NAME" != "sdk_155" ]]; then
            echo "Only sdk_155 is supported" >&2
            exit 1
          fi
          echo "dir=$GITHUB_WORKSPACE/steamworks-sdk/$SDK_NAME" >> "$GITHUB_OUTPUT"

      - name: Validate SDK path
        shell: bash
        run: |
          if [[ ! -d "${{ steps.sdk.outputs.dir }}" ]]; then
            echo "Steamworks SDK directory not found: ${{ steps.sdk.outputs.dir }}" >&2
            exit 1
          fi

      - name: Build Windows extension
        shell: pwsh
        run: make build-exts-windows STEAMWORKS_SDK_DIR="${{ steps.sdk.outputs.dir }}"

      - name: Resolve Windows artifact name
        id: artifact
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            echo "basename=steamworks-$version-windows" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "${GITHUB_REF_NAME}" in
            main)
              echo "basename=steamworks-latest-windows" >> "$GITHUB_OUTPUT"
              ;;
            develop)
              echo "basename=steamworks-develop-windows" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "basename=steamworks-${GITHUB_SHA::7}-windows" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Upload Windows build tree
        uses: actions/upload-artifact@v7
        with:
          name: exts-build-windows
          path: .build/windows-l4d2
          if-no-files-found: error
          retention-days: 1

  release-windows:
    runs-on: windows-2022
    needs: build-exts-windows

    steps:
      - name: Checkout SteamWorks
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download Windows build tree
        uses: actions/download-artifact@v8
        with:
          name: exts-build-windows
          path: .build/windows-l4d2

      - name: Package Windows extension tree
        shell: pwsh
        run: make package-exts-windows

      - name: Create Windows release zip
        shell: pwsh
        run: make release-windows RELEASE_BASENAME="${{ needs.build-exts-windows.outputs.basename }}"

      - name: Validate Windows artifact
        shell: bash
        env:
          EXTS_ARTIFACT_DIR: ${{ github.workspace }}/dist/windows/artifact
          EXTS_PLATFORM: windows
        run: make validate-artifact-windows

      - name: Upload Windows release zip
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.build-exts-windows.outputs.basename }}
          path: dist/release/${{ needs.build-exts-windows.outputs.basename }}.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    runs-on: ubuntu-22.04
    needs: [build-exts-linux, build-exts-windows, release-linux, release-windows]
    if: >-
      (github.event_name != 'workflow_dispatch' || inputs.publish_release) &&
      (github.ref_type == 'branch' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')))

    steps:
      - name: Checkout SteamWorks
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download Linux release artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build-exts-linux.outputs.basename }}
          path: dist/release

      - name: Download Windows release artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build-exts-windows.outputs.basename }}
          path: dist/release

      - name: Move channel tag
        if: github.ref_type == 'branch' && (github.ref_name == 'main' || github.ref_name == 'develop')
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "${{ needs.build-exts-linux.outputs.release-tag }}" "$GITHUB_SHA"
          git push origin "refs/tags/${{ needs.build-exts-linux.outputs.release-tag }}" --force

      - name: Publish channel release
        if: github.ref_type == 'branch' && (github.ref_name == 'main' || github.ref_name == 'develop')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ needs.build-exts-linux.outputs.release-tag }}"
          title="${{ needs.build-exts-linux.outputs.release-name }}"
          linux_asset="dist/release/${{ needs.build-exts-linux.outputs.basename }}.zip"
          windows_asset="dist/release/${{ needs.build-exts-windows.outputs.basename }}.zip"
          # Check local inputs and API access before removing the published release.
          test -s "$linux_asset"
          test -s "$windows_asset"
          existing_tags="$(gh release list --limit 1000 --json tagName --jq '.[].tagName')"
          notes_file="$(mktemp)"
          trap 'rm -f "$notes_file"' EXIT
          updated_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          attempt="${GITHUB_RUN_ATTEMPT:-1}"
          {
            printf 'Actualización del canal **%s**.\n\n' "$title"
            printf -- '- Fecha de actualización (UTC): %s\n' "$updated_at"
            printf -- '- Commit: [%s](%s/%s/commit/%s)\n' "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA"
            printf -- '- Ejecución de CI: [#%s, intento %s](%s/%s/actions/runs/%s/attempts/%s)\n' "$GITHUB_RUN_ID" "$attempt" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$attempt"
          } > "$notes_file"
          if grep -Fxq -- "$tag" <<< "$existing_tags"; then
            # Keep the Git tag: release and asset URLs use this stable tag/name.
            gh release delete "$tag" --yes
          fi
          gh release create "$tag" --draft --verify-tag --title "$title" --notes-file "$notes_file"
          gh release upload "$tag" "$linux_asset" "$windows_asset"
          if [[ "${{ needs.build-exts-linux.outputs.prerelease }}" == "true" ]]; then
            gh release edit "$tag" --draft=false --prerelease --latest=false
          else
            gh release edit "$tag" --draft=false --prerelease=false --latest
          fi

      - name: Publish tagged release
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          title="${{ needs.build-exts-linux.outputs.release-name }}"
          linux_asset="dist/release/${{ needs.build-exts-linux.outputs.basename }}.zip"
          windows_asset="dist/release/${{ needs.build-exts-windows.outputs.basename }}.zip"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$title" --latest
          else
            gh release create "$tag" --title "$title" --verify-tag --latest
          fi
          gh release upload "$tag" "$linux_asset" "$windows_asset" --clobber
