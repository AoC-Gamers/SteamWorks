sonar.projectKey=SteamWorks
sonar.projectName=SteamWorks
sonar.sourceEncoding=UTF-8
sonar.sources=extension,scripts
sonar.exclusions=**/__pycache__/**
# Plugin comunitario sonar-cxx, distinto de SonarCFamily.
sonar.cxx.file.suffixes=.c,.cc,.cpp,.cxx,.h,.hh,.hpp,.hxx
# A parser error must fail analysis instead of publishing partial C++ metrics.
sonar.cxx.errorRecoveryEnabled=false
